<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>BookingBud · Hachimi27</title>
  <style>
    :root{color-scheme:light;--ink:#15233a;--muted:#64748b;--green:#287457;--line:#dce3ec;--paper:#f4f6fb;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:760px;margin:0 auto;padding:56px 24px 72px}.brand{font-size:14px;color:var(--green);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:clamp(34px,7vw,52px);line-height:1.08;letter-spacing:-.04em;margin:16px 0}p{color:var(--muted);margin:0 0 28px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin:16px 0;box-shadow:0 8px 28px #15233a0a}
    a{color:var(--green);font-weight:650;text-decoration:none}a:hover{text-decoration:underline}.links{display:grid;grid-template-columns:1fr 1fr;gap:14px}.links a{display:block;border-radius:16px;background:#e5f1eb;padding:18px 20px}.small{font-size:14px}
    @media(max-width:520px){main{padding:40px 18px}.links{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <div class="brand">Hachimi27</div>
  <h1>BookingBud</h1>
  <p>Booking tools and support information.</p>
  <section class="card links" aria-label="Information">
    <a href="privacy/">Privacy Policy <span aria-hidden="true">→</span></a>
    <a href="support/">Support <span aria-hidden="true">→</span></a>
  </section>
  <p class="small">English · Français</p>
</main></body></html>
